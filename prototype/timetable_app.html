<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a7f5a">
<title>我的课表 · 郑文娟</title>
<style>
  :root { --green:#1a7f5a; --green-l:#e6f4ee; --line:#e0e0e0; --amber:#f08c00; }
  * { touch-action:manipulation; box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; background:#f5f6f7; color:#222;
         display:flex; flex-direction:column; height:100dvh; }
  header { background:var(--green); color:#fff; padding:10px 14px; flex:none; display:flex; align-items:center; }
  header h1 { font-size:16px; font-weight:600; }
  header .sub { font-size:12px; opacity:.85; margin-top:2px; }
  header button { background:rgba(255,255,255,.2); border:none; color:#fff; font-size:12px;
                  border-radius:8px; padding:6px 10px; margin-left:6px; }
  nav { display:flex; background:#fff; border-bottom:1px solid var(--line); flex:none; }
  nav button { flex:1; padding:11px; border:none; background:none; font-size:14px; color:#888; border-bottom:2px solid transparent; }
  nav button.on { color:var(--green); border-bottom-color:var(--green); font-weight:600; }
  main { flex:1; overflow:auto; padding-bottom:80px; }
  .fab { position:fixed; right:16px; bottom:24px; width:52px; height:52px; border-radius:50%;
         background:var(--green); color:#fff; font-size:26px; border:none; box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:9; }

  /* ---- 周视图：上网格 + 下方当天面板 ---- */
  #weekView { padding:6px 4px; display:flex; flex-direction:column; gap:8px; }
  .grid { display:grid; grid-template-columns:46px repeat(5,1fr); gap:3px; width:100%; }
  .hd { text-align:center; font-size:11px; color:#666; padding:8px 0; background:#fff; border-radius:5px; border:none; }
  .hd.today { background:var(--green); color:#fff; font-weight:600; }
  .hd.selon { outline:2px solid var(--green); }
  .slot { background:#fff; border-radius:5px; padding:5px 1px; font-size:9px; color:#666; text-align:center; line-height:1.4; }
  .slot b { display:block; font-size:11px; color:#333; white-space:nowrap; }
  .cell, .grid, .hd, .slot { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .cell { background:#fff; border-radius:5px; min-height:60px; padding:3px 2px; display:flex; flex-direction:column;
          align-items:center; justify-content:center; border:none; position:relative; }
  .cell.has { background:var(--green-l); border-left:3px solid var(--green); }
  .cell.todaycol { outline:2px solid #f5c542; outline-offset:-2px; }
  .cell.selon { outline:2px solid var(--green); outline-offset:-2px; }
  .cell.droptarget { outline:2px dashed var(--green); outline-offset:-2px; background:#fff; }
  .cell.dragging { opacity:.35; }
  .cell.movedout { opacity:.45; }
  .cell .cls { font-size:12px; font-weight:600; color:var(--green); }
  .cell .t { font-size:9px; color:#555; margin-top:1px; }
  .cell .adj { position:absolute; top:2px; right:3px; font-size:9px; color:var(--amber); }
  .ghost { position:fixed; z-index:30; pointer-events:none; background:var(--green-l); border:2px solid var(--green);
           border-radius:6px; padding:6px 10px; font-size:12px; font-weight:600; color:var(--green); box-shadow:0 6px 16px rgba(0,0,0,.2); }
  .wpanel { background:#fff; border-radius:10px; padding:12px 14px; font-size:14px; }
  .wpanel h3 { font-size:14px; color:var(--green); margin-bottom:8px; }
  .wpanel .li { padding:6px 0; border-bottom:1px dashed #eee; font-size:13px; }
  .wpanel .li:last-of-type { border:none; }
  .wpanel .addbtn { margin-top:10px; width:100%; padding:9px; border:none; border-radius:8px;
    background:var(--green-l); color:var(--green); font-size:13px; font-weight:600; }
  .hint { font-size:11px; color:#999; text-align:center; }

  /* ---- 卡片/待办 ---- */
  .day-card { background:#fff; border-radius:10px; padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:center; }
  .day-card .time { font-size:13px; color:#666; width:76px; flex:none; }
  .day-card .time b { display:block; font-size:15px; color:#222; }
  .day-card .info .cls { font-size:16px; font-weight:600; color:var(--green); }
  .day-card .info .p { font-size:12px; color:#999; margin-top:2px; }
  .day-card.now { border:2px solid var(--green); background:var(--green-l); }
  .day-card .tag { margin-left:auto; font-size:11px; background:var(--green); color:#fff; border-radius:10px; padding:2px 8px; flex:none; }
  .empty { text-align:center; color:#999; padding:14px 0; font-size:13px; }
  .todo { background:#fff; border-radius:10px; padding:6px 14px; margin-bottom:8px; display:flex; gap:10px; align-items:center; font-size:14px; }
  .todo input[type=checkbox] { width:18px; height:18px; accent-color:var(--green); flex:none; }
  .todo.done span { text-decoration:line-through; color:#aaa; }
  .todo .del { margin-left:auto; color:#999; border:none; background:none; font-size:16px; padding:8px 10px; }
  .sect { font-size:13px; color:#888; margin:14px 4px 8px; }

  /* ---- 月视图 ---- */
  #monthView { padding:10px; }
  .cal { background:#fff; border-radius:10px; padding:10px 8px; }
  .cal .wk { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:#999; padding:4px 0; }
  .cal .days { display:grid; grid-template-columns:repeat(7,1fr); row-gap:2px; }
  .cal .d { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:50%; font-size:13px; border:none; background:none; color:#222; }
  .cal .d.out { color:#ccc; }
  .cal .d.today { background:var(--green); color:#fff; font-weight:600; }
  .cal .d.sel { box-shadow:inset 0 0 0 2px var(--green); }
  .cal .d .dots { display:flex; gap:2px; height:5px; margin-top:1px; }
  .cal .d .dot { width:4px; height:4px; border-radius:50%; background:var(--green); }
  .cal .d .todo-dot { width:4px; height:4px; border-radius:50%; background:var(--amber); }
  .mhead { display:flex; justify-content:space-between; align-items:center; padding:4px 6px 10px; }
  .mhead b { font-size:16px; }
  .mhead button { border:none; background:var(--green-l); color:var(--green); width:30px; height:30px; border-radius:8px; font-size:15px; }
  .daydetail { background:#fff; border-radius:10px; padding:12px 14px; margin-top:10px; font-size:14px; }
  .daydetail h3 { font-size:14px; margin-bottom:8px; color:var(--green); }
  .daydetail .li { padding:6px 0; border-bottom:1px dashed #eee; font-size:13px; }
  .daydetail .li:last-of-type { border:none; }
  .daydetail .addbtn { margin-top:10px; width:100%; padding:9px; border:none; border-radius:8px;
    background:var(--green-l); color:var(--green); font-size:13px; font-weight:600; }

  /* ---- 弹窗 ---- */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; z-index:20; }
  .sheet { background:#fff; width:100%; border-radius:16px 16px 0 0; padding:18px 16px 28px; }
  .sheet h3 { font-size:15px; margin-bottom:12px; }
  .sheet textarea { width:100%; height:70px; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:14px; resize:none; }
  .sheet input[type=date] { border:1px solid var(--line); border-radius:8px; padding:8px; font-size:14px; margin-bottom:10px; width:100%; }
  .sheet .desc { font-size:14px; line-height:1.6; margin-bottom:8px; }
  .sheet .desc b { color:var(--green); }
  .sheet .row { display:flex; gap:10px; margin-top:12px; }
  .sheet .row button { flex:1; padding:11px; border:none; border-radius:8px; font-size:14px; }
  .b-cancel { background:#f0f0f0; color:#666; } .b-ok { background:var(--green); color:#fff; font-weight:600; }
  .b-amber { background:#fff4e0; color:var(--amber); font-weight:600; }
  #toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff;
           font-size:13px; padding:8px 16px; border-radius:20px; z-index:40; display:none; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<header>
  <div style="flex:1"><h1 id="hTitle">信息技术 · 郑文娟</h1><div class="sub" id="headSub"></div></div>
  <button onclick="document.getElementById('fileIn').click()">导入课表</button>
  <input type="file" id="fileIn" accept=".json,application/json">
</header>
<nav>
  <button id="tabToday" class="on">今天</button>
  <button id="tabWeek">周课表</button>
  <button id="tabMonth">月历</button>
</nav>
<main id="main"></main>
<button class="fab" aria-label="添加待办" onclick="openTodoSheet()">+</button>
<div id="toast"></div>

<script>
/* ================= 数据 ================= */
const DEFAULT_DATA = {
  teacher:"郑文娟", subject:"信息技术",
  semStart:"2026-09-01", semEnd:"2027-01-27",
  periods:{ "3":["10:25","11:05"], "4":["11:20","12:00"], "5":["14:00","14:40"], "6":["14:55","15:35"] },
  lessons:[ [1,3,"六.5"],[1,4,"四.4"],[1,5,"四.7"],[2,5,"六.4"],
    [3,3,"四.6"],[3,4,"六.3"],[3,5,"六.2"],[3,6,"六.6"],
    [4,4,"四.2"],[4,5,"四.1"],[4,6,"四.5"],[5,3,"六.1"],[5,5,"四.3"],[5,6,"六.7"] ]
};
let DATA = JSON.parse(localStorage.getItem("tt_data") || "null") || DEFAULT_DATA;
let ADJ  = JSON.parse(localStorage.getItem("tt_adj")  || "[]"); // 临时调课 {id,date,from:[wd,p],to:[wd,p],cls}
let TODOS = JSON.parse(localStorage.getItem("tt_todos") || "[]");

function saveAll(){ localStorage.setItem("tt_data", JSON.stringify(DATA));
                    localStorage.setItem("tt_adj", JSON.stringify(ADJ));
                    localStorage.setItem("tt_todos", JSON.stringify(TODOS)); }
function dstr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function pdate(s){ return new Date(s+"T00:00:00"); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block";
                     clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2200); }

/* 导入课表 JSON */
document.getElementById("fileIn").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result);
      if(!Array.isArray(j.lessons)) throw 0;
      const p = {};
      j.lessons.forEach(l=>{ p[l.period] = [l.start, l.end]; });
      DATA = { teacher:j.teacher||"教师", subject:j.subject||"课程",
        semStart:j.semStart||j.start_date||DATA.semStart, semEnd:j.semEnd||j.end_date||DATA.semEnd,
        periods:p, lessons:j.lessons.map(l=>[l.weekday, l.period, l["class"]||l.cls||""]) };
      ADJ = []; saveAll();
      document.getElementById("hTitle").textContent = `${DATA.subject} · ${DATA.teacher}`;
      toast("导入成功：" + j.lessons.length + " 节课"); setTab(tab);
    }catch(_){ toast("文件格式不对，请导入 timetable.json 格式"); }
  };
  r.readAsText(f); e.target.value = "";
});

/* ================= 课表计算 ================= */
const WD = ["一","二","三","四","五","六","日"];
const WDS = ["日","一","二","三","四","五","六"]; // JS getDay(): 0=周日
const main = document.getElementById("main");
const today = new Date();
const todayWd = (today.getDay()>=1 && today.getDay()<=5) ? today.getDay() : -1;
const fmt = d => `${d.getMonth()+1}月${d.getDate()}日 周${WDS[d.getDay()]}`;
function inSemester(d){ const ds=dstr(d); return ds>=DATA.semStart && ds<=DATA.semEnd; }
function mondayOf(d){ const m=new Date(d); const k=(m.getDay()+6)%7; m.setDate(m.getDate()-k); return m; }

/* 某日期的实际课程 = 基课表(按星期) + 临时调课(调出/调入按各自日期生效)，学期外为空 */
function lessonsOn(dt){
  const ds = dstr(dt);
  let ls = inSemester(dt) ? DATA.lessons.filter(l=>l[0]==dt.getDay()).map(l=>({p:l[1],cls:l[2],adj:""})) : [];
  ADJ.filter(a=>a.fromDate==ds).forEach(a=>{ ls = ls.filter(l=>l.p!=a.fromP); });
  ADJ.filter(a=>a.toDate==ds).forEach(a=>{ ls = ls.filter(l=>l.p!=a.toP); ls.push({p:a.toP, cls:a.cls, adj:"调"}); });
  return ls.sort((a,b)=>a.p-b.p);
}
function baseAt(wd,p){ return DATA.lessons.find(l=>l[0]==wd&&l[1]==p); }

/* ================= 今天视图 ================= */
function renderToday(){
  document.getElementById("headSub").textContent = fmt(today) + (inSemester(today)?"":"（假期中）");
  const ds = dstr(today);
  let h = "<div id='todayView'><div class='sect'>今天的课</div>";
  const ls = lessonsOn(today);
  if(!ls.length) h += "<div class='empty'>今天没有课</div>";
  const now = today.getHours()*60+today.getMinutes();
  ls.forEach(l=>{
    const [s,e] = DATA.periods[l.p].map(t=>{const[a,b]=t.split(":");return +a*60+ +b;});
    h += `<div class="day-card${now>=s&&now<e?" now":""}">
      <div class="time"><b>${DATA.periods[l.p][0]}</b>${DATA.periods[l.p][1]}</div>
      <div class="info"><div class="cls">${DATA.subject} ${l.cls}</div><div class="p">第${l.p}节${l.adj?" · 临时调课":""}</div></div>
      ${now>=s&&now<e?"<span class='tag'>进行中</span>":""}</div>`;
  });
  h += "<div class='sect'>今日待办</div><div id='todayTodos'></div></div>";
  main.innerHTML = h;
  renderTodoList(document.getElementById("todayTodos"), ds);
}
function renderTodoList(el, ds){
  const ts = TODOS.filter(t=>t.date==ds);
  if(!ts.length){ el.innerHTML = "<div class='empty'>暂无待办，点右下角 + 添加</div>"; return; }
  el.innerHTML = ts.map(t=>`<div class="todo${t.done?" done":""}">
    <input type="checkbox" aria-label="完成" ${t.done?"checked":""} onchange="toggleTodo(${t.id})">
    <span>${t.text}</span>
    <button class="del" aria-label="删除待办" onclick="delTodo(${t.id})">✕</button></div>`).join("");
}
function toggleTodo(id){ const t=TODOS.find(x=>x.id==id); t.done=!t.done; saveAll(); setTab(tab); }
function delTodo(id){ if(!confirm("确定删除这条待办吗？")) return; TODOS=TODOS.filter(x=>x.id!=id); saveAll(); setTab(tab); }

/* ================= 周视图（网格 + 当天面板 + 拖拽调课） ================= */
let selWd = todayWd>0 ? todayWd : 1;   // 周视图当前选中的星期
let drag = null;

function renderWeek(){
  document.getElementById("headSub").textContent = "点星期看当天 · 长按课程拖到空格可调课";
  const periods = Object.keys(DATA.periods).map(Number).sort((a,b)=>a-b);
  const mon = mondayOf(today);
  let h = `<div id='weekView'><div class='grid'><div class="hd">节次</div>`;
  for(let w=1;w<=5;w++){
    const dte = new Date(mon); dte.setDate(mon.getDate()+w-1);
    h += `<button class="hd${w==todayWd?" today":""}${w==selWd?" selon":""}" onclick="selWdF(${w})">${w==todayWd?"今天·":""}周${WD[w-1]}<small style="display:block;font-size:9px;font-weight:400">${dte.getMonth()+1}/${dte.getDate()}</small></button>`;
  }
  periods.forEach(p=>{
    h += `<div class="slot"><b>第${p}节</b>${DATA.periods[p][0]}<br>${DATA.periods[p][1]}</div>`;
    for(let w=1;w<=5;w++){
      const b = baseAt(w,p);
      const dt = new Date(mon); dt.setDate(mon.getDate()+w-1);
      const ds2 = dstr(dt);
      const inAdj = ADJ.find(a=>a.toDate==ds2 && a.toP==p);
      const outAdj = ADJ.find(a=>a.fromDate==ds2 && a.fromP==p);
      const showCls = inAdj ? inAdj.cls : (b ? b[2] : "");
      h += `<div class="cell${b||inAdj?" has":""}${w==todayWd?" todaycol":""}${w==selWd?" selon":""}${outAdj&&!inAdj?" movedout":""}"
              data-wd="${w}" data-p="${p}" ${b?`data-cls="${b[2]}"`:""}>
              ${showCls?`<div class="cls">${showCls}</div><div class="t">${DATA.periods[p][0]}</div>${inAdj?'<div class="adj">调</div>':(outAdj?'<div class="adj">调出</div>':"")}`:""}
            </div>`;
    }
  });
  h += `</div><div class="hint">长按有课格子拖到空格子：可选 仅当天调课 / 整学期调课</div>
        <div class="wpanel" id="wpanel"></div></div>`;
  main.innerHTML = h;
  renderWeekPanel();
  bindDrag();
}

function renderWeekPanel(){
  const mon = mondayOf(today);
  const dt = new Date(mon); dt.setDate(mon.getDate()+selWd-1);
  const ds = dstr(dt), el = document.getElementById("wpanel");
  if(!el) return;
  const ls = lessonsOn(dt);
  const ts = TODOS.filter(t=>t.date==ds);
  el.innerHTML = `<h3>${fmt(dt)}${inSemester(dt)?"":"（假期）"}${ds==dstr(today)?" · 今天":""}</h3>`
   + (ls.length ? ls.map(l=>`<div class="li">第${l.p}节 ${DATA.periods[l.p][0]}–${DATA.periods[l.p][1]} · ${DATA.subject} <b style="color:var(--green)">${l.cls}</b>${l.adj?"（临时调课）":""}</div>`).join("")
                : "<div class='empty'>无课</div>")
   + (ts.length ? "<div class='sect' style='margin:8px 0 2px'>待办</div>" + ts.map(t=>`<div class="li">${t.done?"<span style='color:var(--green)'>■</span>":"□"} ${t.text}</div>`).join("") : "")
   + `<button class="addbtn" onclick="openTodoSheet('${ds}')">+ 添加这天的待办</button>`;
}
function selWdF(w){ selWd = w; renderWeek(); }

/* ---- 长按拖拽调课（触屏 + 鼠标） ---- */
function bindDrag(){
  const grid = main.querySelector(".grid"); if(!grid) return;
  bindDrag._lp = null;
  const lpTimer = { get current(){ return bindDrag._lp; }, set v(t){ bindDrag._lp = t; } };
  function cellFromPoint(x,y){
    const el = document.elementFromPoint(x,y);
    return el && el.classList.contains("cell") ? el : null;
  }
  function start(e, cx, cy){
    const c = e.target.closest(".cell.has"); if(!c) return;
    drag = { from:c, cls:c.dataset.cls, wd:+c.dataset.wd, p:+c.dataset.p, active:false, sx:cx, sy:cy };
    lpTimer.v = setTimeout(()=>{
      drag.active = true;
      const g = document.createElement("div"); g.className="ghost"; g.textContent=`${drag.cls} 第${drag.p}节`;
      document.body.appendChild(g); drag.ghost=g; moveGhost(cx,cy);
      c.classList.add("dragging"); if(navigator.vibrate) navigator.vibrate(30);
    }, 400);
  }
  function moveGhost(x,y){ if(drag&&drag.ghost){ drag.ghost.style.left=(x+14)+"px"; drag.ghost.style.top=(y-30)+"px"; } }
  function move(e, cx, cy, isMouse){
    if(!drag) return;
    if(!drag.active){
      if(isMouse && Math.hypot(cx-drag.sx,cy-drag.sy)>8){
        lpTimer.v=null; drag.active=true;
        const g=document.createElement("div"); g.className="ghost"; g.textContent=`${drag.cls} 第${drag.p}节`;
        document.body.appendChild(g); drag.ghost=g; moveGhost(cx,cy);
        drag.from.classList.add("dragging");
        return;
      }
      if(Math.hypot(cx-drag.sx,cy-drag.sy)>10){ clearTimeout(lpTimer); drag=null; } return;
    }
    e.preventDefault(); moveGhost(cx,cy);
    main.querySelectorAll(".droptarget").forEach(x=>x.classList.remove("droptarget"));
    const t = cellFromPoint(cx,cy);
    if(t && !t.classList.contains("has")) t.classList.add("droptarget");
  }
  function end(e, cx, cy){
    lpTimer.v = null;
    if(!drag) return;
    const d = drag; drag = null;
    if(d.ghost) d.ghost.remove();
    d.from.classList.remove("dragging");
    main.querySelectorAll(".droptarget").forEach(x=>x.classList.remove("droptarget"));
    if(!d.active) return;
    const t = cellFromPoint(cx,cy);
    if(t && !t.classList.contains("has")) openMoveSheet(d, t);
  }
  grid.addEventListener("touchstart", e=>start(e, e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  grid.addEventListener("touchmove",  e=>move(e, e.touches[0].clientX, e.touches[0].clientY),  {passive:false});
  grid.addEventListener("touchend",   e=>end(e, e.changedTouches[0].clientX, e.changedTouches[0].clientY));
  grid.addEventListener("touchcancel",()=>{ clearTimeout(lpTimer); if(drag&&drag.ghost) drag.ghost.remove(); drag=null;
    main.querySelectorAll(".dragging,.droptarget").forEach(x=>x.classList.remove("dragging","droptarget")); });
  grid.addEventListener("mousedown",  e=>start(e, e.clientX, e.clientY));
  window.addEventListener("mousemove",e=>{ if(drag) move(e, e.clientX, e.clientY, true); });
  window.addEventListener("mouseup",  e=>{ if(drag) end(e, e.clientX, e.clientY); });
}

/* 调课确认：仅当天 / 整学期 */
function openMoveSheet(d, toCell){
  const toWd = +toCell.dataset.wd, toP = +toCell.dataset.p;
  const mon = mondayOf(today);
  const dt = new Date(mon); dt.setDate(mon.getDate()+d.wd-1);
  const ds = dstr(dt);
  const dte = new Date(mon); dte.setDate(mon.getDate()+toWd-1);
  const toDs = dstr(dte);
  const m = document.createElement("div");
  m.className = "mask"; m.onclick = e=>{ if(e.target==m) m.remove(); };
  m.innerHTML = `<div class="sheet"><h3>调课</h3>
    <div class="desc"><b>${d.cls}</b>：周${WD[d.wd-1]}第${d.p}节（${ds}）<br>调到 周${WD[toWd-1]}第${toP}节（${DATA.periods[toP][0]}）</div>
    <div class="row"><button class="b-cancel" onclick="this.closest('.mask').remove()">取消</button></div>
    <div class="desc" style="color:#999;font-size:12px">仅当天：只改 ${ds} 这天（临时/补课）；整学期：每周都按新时间上</div>
    <div class="row"><button class="b-amber" onclick="doMove('temp','${ds}',${d.p},'${toDs}',${toP},'${d.cls}')">仅当天（临时）</button></div>
    <div class="row"><button class="b-ok" onclick="doMove('perm',${d.wd},${d.p},${toWd},${toP},'${d.cls}')">整学期（长期）</button></div></div>`;
  document.body.appendChild(m);
}
// perm: (wd, p, toWd, toP, cls)；temp: (fromDate, fromP, toDate, toP, cls)
function doMove(type, a, b, c, d, cls){
  if(type=="perm"){
    const [wd,p,toWd,toP] = [a,b,c,d];
    DATA.lessons = DATA.lessons.filter(l=>!(l[0]==wd&&l[1]==p));
    DATA.lessons = DATA.lessons.filter(l=>!(l[0]==toWd&&l[1]==toP));
    DATA.lessons.push([toWd,toP,cls]); saveAll();
    toast("已整学期调课");
  }else{
    const [fromDate,fromP,toDate,toP] = [a,b,c,d];
    ADJ = ADJ.filter(x=>!(x.fromDate==fromDate&&x.fromP==fromP));
    ADJ.push({id:Date.now(), fromDate, fromP, toDate, toP, cls}); saveAll();
    toast(`已临时调课：${fromDate} 第${fromP}节 调至 ${toDate} 第${toP}节`);
  }
  document.querySelectorAll(".mask").forEach(x=>x.remove());
  setTab(tab);
}

/* ================= 月视图（学期内才显示课程） ================= */
let mYear = today.getFullYear(), mMonth = today.getMonth(), selDate = null;
function renderMonth(){
  document.getElementById("headSub").textContent = `学期 ${DATA.semStart} 至 ${DATA.semEnd}`;
  const first = new Date(mYear, mMonth, 1);
  const startWd = (first.getDay()+6)%7;
  const dim = new Date(mYear, mMonth+1, 0).getDate();
  let h = `<div id='monthView'><div class='cal'><div class='mhead'>
    <button aria-label="上个月" onclick="mShift(-1)">‹</button><b>${mYear}年${mMonth+1}月</b><button aria-label="下个月" onclick="mShift(1)">›</button></div>
    <div class='wk'>${WD.map(w=>`<div>${w}</div>`).join("")}</div><div class='days'>`;
  for(let i=0;i<startWd;i++) h += "<div></div>";
  for(let d=1;d<=dim;d++){
    const dt = new Date(mYear,mMonth,d);
    const inSem = inSemester(dt);
    const n = inSem ? lessonsOn(dt).length : 0;
    const nt = TODOS.filter(t=>t.date==dstr(dt)).length;
    const isT = dt.toDateString()==today.toDateString();
    const isS = selDate && dt.toDateString()==selDate.toDateString();
    h += `<button class="d${isT?" today":""}${isS&&!isT?" sel":""}${inSem?"":" out"}" onclick="sel(${d})">${d}
      <div class="dots">${"<span class='dot'></span>".repeat(Math.min(n,3))}${nt?"<span class='todo-dot'></span>":""}</div></button>`;
  }
  h += "</div></div><div class='daydetail' id='detail'></div></div>";
  main.innerHTML = h;
  if(selDate) showDetail(selDate);
  else document.getElementById("detail").innerHTML = "<h3>当天安排</h3><div class='li' style='border:none;color:#999'>点击上方日期查看</div>";
}
function mShift(n){ mMonth+=n; if(mMonth<0){mMonth=11;mYear--;} if(mMonth>11){mMonth=0;mYear++;} renderMonth(); }
function sel(d){ selDate = new Date(mYear,mMonth,d); renderMonth(); }
function showDetail(dt){
  const ds = dstr(dt), el = document.getElementById("detail");
  const ls = lessonsOn(dt), ts = TODOS.filter(t=>t.date==ds);
  el.innerHTML = `<h3>${fmt(dt)}${inSemester(dt)?"":"（学期外，无课）"}</h3>`
   + (ls.length ? ls.map(l=>`<div class="li">第${l.p}节 ${DATA.periods[l.p][0]}–${DATA.periods[l.p][1]} · ${DATA.subject} <b style="color:var(--green)">${l.cls}</b>${l.adj?"（临时调课）":""}</div>`).join("")
                : "<div class='li' style='border:none;color:#999'>无课</div>")
   + (ts.length ? "<div class='sect' style='margin:8px 0 2px'>待办</div>" + ts.map(t=>`<div class="li">${t.done?"<span style='color:var(--green)'>■</span>":"□"} ${t.text}</div>`).join("") : "")
   + `<button class="addbtn" onclick="openTodoSheet('${ds}')">+ 添加这天的待办</button>`;
}

/* ================= 添加待办 ================= */
function openTodoSheet(ds){
  const d = ds || dstr(today);
  const m = document.createElement("div");
  m.className = "mask"; m.onclick = e=>{ if(e.target==m) m.remove(); };
  m.innerHTML = `<div class="sheet"><h3>添加待办 · ${d}</h3>
    <input type="date" id="tdDate" value="${d}">
    <textarea id="tdText" placeholder="要做什么？如：批改四.3作业、备课、填表格"></textarea>
    <div class="row"><button class="b-cancel" onclick="this.closest('.mask').remove()">取消</button>
    <button class="b-ok" onclick="addTodo()">保存</button></div></div>`;
  document.body.appendChild(m);
}
function addTodo(){
  const date = document.getElementById("tdDate").value;
  const text = document.getElementById("tdText").value.trim();
  if(!text){ toast("请填写待办内容"); return; }
  TODOS.push({ id:Date.now(), date, text, done:false });
  saveAll(); document.querySelectorAll(".mask").forEach(x=>x.remove());
  toast("已添加待办"); setTab(tab);
}

/* ================= 切换 ================= */
let tab = "today";
function clearDragState(){
  clearTimeout(bindDrag._lp);
  document.querySelectorAll(".ghost").forEach(g=>g.remove());
  document.querySelectorAll(".dragging,.droptarget").forEach(c=>c.classList.remove("dragging","droptarget"));
  drag = null;
}
function setTab(t){
  clearDragState();
  tab = t;
  ["Today","Week","Month"].forEach(x=>document.getElementById("tab"+x).classList.toggle("on", t.toLowerCase()==x.toLowerCase()));
  ({today:renderToday, week:renderWeek, month:renderMonth})[t]();
}
let swX=0, swY=0, swOn=false;
main.addEventListener("touchstart",e=>{ swX=e.touches[0].clientX; swY=e.touches[0].clientY; swOn=!drag; },{passive:true});
main.addEventListener("touchend",e=>{
  if(!swOn || drag) return;
  const dx=e.changedTouches[0].clientX-swX, dy=e.changedTouches[0].clientY-swY;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
    const order=["today","week","month"], i=order.indexOf(tab);
    setTab(order[Math.min(order.length-1,Math.max(0,i+(dx<0?1:-1)))]);
  }
},{passive:true});
document.getElementById("tabToday").onclick = ()=>setTab("today");
document.getElementById("tabWeek").onclick = ()=>setTab("week");
document.getElementById("tabMonth").onclick = ()=>setTab("month");
document.getElementById("hTitle").textContent = `${DATA.subject} · ${DATA.teacher}`;
setTab("today");
</script>
