<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a7f5a">
<title>我的课表 v2 · 郑文娟</title>
<style>
  :root { --green:#1a7f5a; --green-l:#e6f4ee; --line:#e0e0e0; --amber:#f08c00; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; background:#f5f6f7; color:#222;
         display:flex; flex-direction:column; height:100dvh; }
  header { background:var(--green); color:#fff; padding:10px 14px; flex:none; display:flex; align-items:center; }
  header h1 { font-size:16px; font-weight:600; }
  header .sub { font-size:12px; opacity:.85; margin-top:2px; }
  header button { background:rgba(255,255,255,.2); border:none; color:#fff; font-size:12px;
                  border-radius:8px; padding:6px 10px; margin-left:6px; }
  nav { display:flex; background:#fff; border-bottom:1px solid var(--line); flex:none; }
  nav button { flex:1; padding:11px; border:none; background:none; font-size:14px; color:#888; border-bottom:2px solid transparent; }
  nav button.on { color:var(--green); border-bottom-color:var(--green); font-weight:600; }
  main { flex:1; overflow:auto; padding:8px 6px 90px; }
  .fab { position:fixed; right:16px; bottom:24px; width:52px; height:52px; border-radius:50%;
         background:var(--green); color:#fff; font-size:26px; border:none; box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:9; }

  /* FullCalendar 适配 */
  #cal { background:#fff; border-radius:10px; padding:6px; }
  .fc { font-size:12px; }
  .fc .fc-toolbar.fc-header-toolbar { margin-bottom:8px; flex-wrap:wrap; gap:4px; }
  .fc .fc-button { background:var(--green-l); border:none; color:var(--green); font-size:12px; padding:4px 10px; }
  .fc .fc-button-primary:not(:disabled).fc-button-active { background:var(--green); color:#fff; }
  .fc .fc-toolbar-title { font-size:15px; font-weight:600; }
  .fc-theme-standard td, .fc-theme-standard th, .fc-theme-standard .fc-scrollgrid { border-color:#eee; }
  .fc .fc-timegrid-slot { height:26px; }
  .fc-event { border:none; border-radius:5px; font-size:11px; padding:1px 3px; }
  .fc-daygrid-event { margin:1px 0; }
  .fc-event.les { background:var(--green-l); color:var(--green); border-left:3px solid var(--green); }
  .fc-event.les .fc-event-main { color:var(--green); font-weight:600; }
  .fc-event.adj { background:var(--green-l); border-left:3px solid var(--amber); }
  .fc-event.adj .fc-event-main { color:var(--green); font-weight:600; }
  .fc-event.hol { background:#ffe3e3; color:#c0392b; font-weight:600; }
  .fc-day-sat .fc-daygrid-day-number, .fc-day-sun .fc-daygrid-day-number { color:#c0392b; }

  /* 今天视图 */
  .day-card { background:#fff; border-radius:10px; padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:center; }
  .day-card .time { font-size:13px; color:#666; width:76px; flex:none; }
  .day-card .time b { display:block; font-size:15px; color:#222; }
  .day-card .info .cls { font-size:16px; font-weight:600; color:var(--green); }
  .day-card .info .p { font-size:12px; color:#999; margin-top:2px; }
  .day-card.now { border:2px solid var(--green); background:var(--green-l); }
  .day-card .tag { margin-left:auto; font-size:11px; background:var(--green); color:#fff; border-radius:10px; padding:2px 8px; flex:none; }
  .empty { text-align:center; color:#999; padding:16px 0; font-size:13px; }
  .todo { background:#fff; border-radius:10px; padding:6px 14px; margin-bottom:8px; display:flex; gap:10px; align-items:center; font-size:14px; }
  .todo input[type=checkbox] { width:18px; height:18px; accent-color:var(--green); flex:none; }
  .todo.done span { text-decoration:line-through; color:#aaa; }
  .todo .del { margin-left:auto; color:#999; border:none; background:none; font-size:16px; padding:8px 10px; }
  .sect { font-size:13px; color:#888; margin:14px 4px 8px; }

  /* 弹窗 */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; z-index:20; }
  .sheet { background:#fff; width:100%; border-radius:16px 16px 0 0; padding:18px 16px 28px; }
  .sheet h3 { font-size:15px; margin-bottom:12px; }
  .sheet textarea { width:100%; height:70px; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:14px; resize:none; }
  .sheet input[type=date] { border:1px solid var(--line); border-radius:8px; padding:8px; font-size:14px; margin-bottom:10px; width:100%; }
  .sheet .desc { font-size:14px; line-height:1.6; margin-bottom:8px; }
  .sheet .desc b { color:var(--green); }
  .sheet .note { font-size:12px; color:#999; margin-bottom:6px; }
  .sheet .row { display:flex; gap:10px; margin-top:12px; }
  .sheet .row button { flex:1; padding:11px; border:none; border-radius:8px; font-size:14px; }
  .b-cancel { background:#f0f0f0; color:#666; } .b-ok { background:var(--green); color:#fff; font-weight:600; }
  .b-amber { background:#fff4e0; color:var(--amber); font-weight:600; }
  #toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff;
           font-size:13px; padding:8px 16px; border-radius:20px; z-index:40; display:none; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<header>
  <div style="flex:1"><h1 id="hTitle">信息技术 · 郑文娟</h1><div class="sub" id="headSub"></div></div>
  <button onclick="document.getElementById('fileIn').click()">导入课表</button>
  <input type="file" id="fileIn" accept=".json,application/json">
</header>
<nav>
  <button id="tabToday" class="on">今天</button>
  <button id="tabWeek">周课表</button>
  <button id="tabMonth">月历</button>
</nav>
<main id="main"></main>
<button class="fab" aria-label="添加待办" onclick="openTodoSheet()">+</button>
<div id="toast"></div>

<script src="lib/fullcalendar.global.min.js"></script>
<script>
/* ================= 数据 ================= */
const DEFAULT_DATA = {
  teacher:"郑文娟", subject:"信息技术",
  semStart:"2026-09-01", semEnd:"2027-01-27",
  periods:{ "3":["10:25","11:05"], "4":["11:20","12:00"], "5":["14:00","14:40"], "6":["14:55","15:35"] },
  lessons:[ [1,3,"六.5"],[1,4,"四.4"],[1,5,"四.7"],[2,5,"六.4"],
    [3,3,"四.6"],[3,4,"六.3"],[3,5,"六.2"],[3,6,"六.6"],
    [4,4,"四.2"],[4,5,"四.1"],[4,6,"四.5"],[5,3,"六.1"],[5,5,"四.3"],[5,6,"六.7"] ],
  // 法定假日（年初已知，导入 JSON 可更新；调休补课安排临近再拖拽调整）
  holidays:[
    {date:"2026-09-25", name:"中秋节"},
    {date:"2026-10-01", name:"国庆节"}, {date:"2026-10-02", name:"国庆节"},
    {date:"2026-10-05", name:"国庆节"}, {date:"2026-10-06", name:"国庆节"}, {date:"2026-10-07", name:"国庆节"},
    {date:"2027-01-01", name:"元旦"}
  ]
};
let DATA = JSON.parse(localStorage.getItem("tt2_data") || "null") || DEFAULT_DATA;
let ADJ  = JSON.parse(localStorage.getItem("tt2_adj")  || "[]"); // {id, fromDate, fromP, toDate, toP, cls}
let TODOS = JSON.parse(localStorage.getItem("tt2_todos") || "[]");

function saveAll(){ localStorage.setItem("tt2_data", JSON.stringify(DATA));
                    localStorage.setItem("tt2_adj", JSON.stringify(ADJ));
                    localStorage.setItem("tt2_todos", JSON.stringify(TODOS)); }
function dstr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block";
                     clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2400); }
function holidayOf(d){ return DATA.holidays.find(h=>h.date==dstr(d)); }
function inSemester(d){ const ds=dstr(d); return ds>=DATA.semStart && ds<=DATA.semEnd; }
const WD = ["一","二","三","四","五","六","日"];
const fmt = d => `${d.getMonth()+1}月${d.getDate()}日 周${["日","一","二","三","四","五","六"][d.getDay()]}`;

/* 导入课表 JSON（可含 holidays） */
document.getElementById("fileIn").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result);
      if(!Array.isArray(j.lessons)) throw 0;
      const p = {};
      j.lessons.forEach(l=>{ p[l.period] = [l.start, l.end]; });
      DATA = { teacher:j.teacher||"教师", subject:j.subject||"课程",
        semStart:j.semStart||j.start_date||DATA.semStart, semEnd:j.semEnd||j.end_date||DATA.semEnd,
        periods:p, lessons:j.lessons.map(l=>[l.weekday, l.period, l["class"]||l.cls||""]),
        holidays:j.holidays||DATA.holidays };
      ADJ = []; saveAll();
      document.getElementById("hTitle").textContent = `${DATA.subject} · ${DATA.teacher}`;
      toast("导入成功：" + j.lessons.length + " 节课，假日 " + DATA.holidays.length + " 天"); refreshCal();
    }catch(_){ toast("文件格式不对，请导入 timetable.json 格式"); }
  };
  r.readAsText(f); e.target.value = "";
});

/* ================= 课表计算 ================= */
/* 某日期实际课程：假日隐藏基课；临时调课(补课)对任意日期生效 */
function lessonsOn(dt){
  const ds = dstr(dt);
  let ls = (inSemester(dt) && !holidayOf(dt))
    ? DATA.lessons.filter(l=>l[0]==dt.getDay()).map(l=>({p:l[1],cls:l[2],adj:""})) : [];
  ADJ.filter(a=>a.fromDate==ds).forEach(a=>{ ls = ls.filter(l=>l.p!=a.fromP); });
  ADJ.filter(a=>a.toDate==ds).forEach(a=>{ ls = ls.filter(l=>l.p!=a.toP); ls.push({p:a.toP, cls:a.cls, adj:"调"}); });
  return ls.sort((a,b)=>a.p-b.p);
}
function baseAt(wd,p){ return DATA.lessons.find(l=>l[0]==wd&&l[1]==p); }

/* 生成 FullCalendar 事件（按可视区间） */
function buildEvents(info){
  const evts = [];
  const d0 = new Date(info.start), d1 = new Date(info.end);
  for(const d = new Date(d0); d < d1; d.setDate(d.getDate()+1)){
    const ds = dstr(d);
    const hol = holidayOf(d);
    if(hol && inSemester(d))
      evts.push({ id:"hol-"+ds, title:hol.name+" · 休", start:ds, allDay:true, display:"block",
                  classNames:"hol", editable:false });
    lessonsOn(d).forEach(l=>{
      const [sh,sm] = DATA.periods[l.p][0].split(":"), [eh,em] = DATA.periods[l.p][1].split(":");
      evts.push({ id:`les-${ds}-${l.p}`, title:`${l.cls}${l.adj?"（调）":""} ${DATA.periods[l.p][0]}`,
        start:`${ds}T${sh}:${sm}:00`, end:`${ds}T${eh}:${em}:00`,
        extendedProps:{ cls:l.cls, p:l.p, adj:!!l.adj },
        classNames: l.adj ? "adj" : "les" });
    });
  }
  return evts;
}

/* ================= 日历（周=时间轴 / 月=格子，均支持拖拽） ================= */
let calendar = null, calView = "timeGridWeek";
function refreshCal(){ if(calendar) calendar.refetchEvents(); renderTodayIfVisible(); }
function renderTodayIfVisible(){ if(tab=="today") renderToday(); }

function makeCalendar(){
  const el = document.getElementById("cal");
  calendar = new FullCalendar.Calendar(el, {
    initialView: "timeGridWeek",
    locale: "zh-cn",
    height: "auto",
    firstDay: 1,
    headerToolbar: { left:"prev,next", center:"title", right:"today" },
    buttonText: { today:"今天", week:"周", month:"月" },
    allDayText: "假日",
    slotMinTime: "08:00", slotMaxTime: "17:00",
    editable: true,           // 原生触屏/鼠标拖拽
    eventStartEditable: true,
    durationEditable: false,   // 禁止拉伸改时长（防误触）
    displayEventTime: false,
    dayMaxEventRows: 3,
    eventContent: (arg) => {
      if (arg.view.type == "dayGridMonth"){
        const m = arg.event.title.match(/^(\S+?)(（调）)? (\d+)$/);
        if(m) return { html: `<span style="font-size:10px">${m[1]}${m[2]||""}</span>` };
      }
      return true;
    },
    events: (info, ok) => ok(buildEvents(info)),
    eventDrop: (info) => handleDrop(info),
    eventClick: (info) => {
      const ds = dstr(info.event.start), t = `${String(info.event.start.getHours()).padStart(2,"0")}:${String(info.event.start.getMinutes()).padStart(2,"0")}`;
      const p = Object.keys(DATA.periods).find(k=>DATA.periods[k][0]==t);
      const adj = ADJ.find(x=>x.toDate==ds && x.toP==p);
      if(!adj) return;
      const m = document.createElement("div"); m.className = "mask";
      m.innerHTML = `<div class="sheet"><h3>临时安排</h3>
        <div class="desc"><b>${adj.cls}</b>：${shortDs(adj.fromDate)} 第${adj.fromP}节 临时调到 ${shortDs(ds)} 第${p}节</div>
        <div class="row"><button class="b-cancel" onclick="this.closest('.mask').remove()">关闭</button></div>
        <div class="row"><button class="b-amber" id="undoAdj">撤销（恢复原课表）</button></div></div>`;
      document.body.appendChild(m);
      m.querySelector("#undoAdj").onclick = ()=>{
        ADJ = ADJ.filter(x=>x!==adj); saveAll(); m.remove(); refreshCal(); toast("已恢复原课表");
      };
    },
    datesSet: (s) => { document.getElementById("headSub").textContent =
      dstr(s.start) + " 至 " + dstr(new Date(s.end.getTime()-86400000)) +
      " · 拖动课程块可调课"; }
  });
  calendar.render();
}

/* 拖拽落点 → 临时 / 整学期 */
function handleDrop(info){
  const nd = info.event.start, od = info.oldEvent.start;
  const fromDs = dstr(od), toDs = dstr(nd);
  const toTime = `${String(nd.getHours()).padStart(2,"0")}:${String(nd.getMinutes()).padStart(2,"0")}`;
  const fromTime = `${String(od.getHours()).padStart(2,"0")}:${String(od.getMinutes()).padStart(2,"0")}`;
  const pByTime = t => Object.keys(DATA.periods).find(k=>DATA.periods[k][0]==t);
  const fp = pByTime(fromTime), tp = pByTime(toTime);
  if(!fp || !tp){ toast("时间不对应任何节次，已还原"); info.revert(); return; }
  const cls = info.event.extendedProps.cls || "";
  const m = document.createElement("div");
  m.className = "mask"; 
  m.innerHTML = `<div class="sheet"><h3>调课</h3>
    <div class="desc"><b>${cls}</b>：${shortDs(fromDs)} 第${fp}节<br>调到 ${shortDs(toDs)} 第${tp}节（${DATA.periods[tp][0]}）${holidayOf(nd)?"<br><span style='color:var(--amber)'>目标日是假日：本次为补课安排</span>":""}</div>
    <div class="note">仅当天：只改 ${fromDs}→${toDs} 这一次；整学期：每周都按新时间上</div>
    <div class="row"><button class="b-cancel" id="mvCancel">取消</button></div>
    <div class="row"><button class="b-amber" id="mvTemp">仅当天（临时）</button></div>
    <div class="row"><button class="b-ok" id="mvPerm">整学期（长期）</button></div></div>`;
  document.body.appendChild(m);
  const close = ()=>{ m.remove(); };
  m.querySelector("#mvCancel").onclick = ()=>{ info.revert(); close(); };
  m.querySelector("#mvTemp").onclick = ()=>{
    ADJ = ADJ.filter(x=>!(x.fromDate==fromDs&&x.fromP==fp));
    const inv = ADJ.find(x=>x.toDate==fromDs&&x.toP==fp&&x.fromDate==toDs&&x.toP==tp&&x.cls==cls);
    if(inv) ADJ = ADJ.filter(x=>x!==inv);
    else ADJ.push({id:Date.now(), fromDate:fromDs, fromP:fp, toDate:toDs, toP:tp, cls});
    saveAll(); info.revert(); close(); refreshCal();
    toast(holidayOf(nd) ? "已安排补课（仅 "+toDs+"）" : "已临时调课");
  };
  m.querySelector("#mvPerm").onclick = ()=>{
    const od_w = pdate(fromDs).getDay(), nd_w = pdate(toDs).getDay();
    DATA.lessons = DATA.lessons.filter(l=>!(l[0]==od_w&&l[1]==fp));
    DATA.lessons = DATA.lessons.filter(l=>!(l[0]==nd_w&&l[1]==tp));
    DATA.lessons.push([nd_w,tp,cls]); saveAll();
    ADJ = ADJ.filter(x=>!(x.fromDate==fromDs&&x.fromP==fp));
    info.revert(); close(); refreshCal(); toast("已整学期调课");
  };
}
function pdate(s){ return new Date(s+"T00:00:00"); }
function shortDs(ds){ const d=pdate(ds); return (d.getMonth()+1)+"月"+d.getDate()+"日"; }

/* ================= 今天视图 ================= */
function renderToday(){
  document.getElementById("headSub").textContent = fmt(today) +
    (holidayOf(today) ? " · " + holidayOf(today).name + "（休）" : (inSemester(today)?"":"（假期中）"));
  const ds = dstr(today);
  let h = "<div><div class='sect'>今天的课</div>";
  const ls = lessonsOn(today);
  if(!ls.length) h += "<div class='empty'>今天没有课</div>";
  const now = today.getHours()*60+today.getMinutes();
  ls.forEach(l=>{
    const [s,e] = DATA.periods[l.p].map(t=>{const[a,b]=t.split(":");return +a*60+ +b;});
    h += `<div class="day-card${now>=s&&now<e?" now":""}">
      <div class="time"><b>${DATA.periods[l.p][0]}</b>${DATA.periods[l.p][1]}</div>
      <div class="info"><div class="cls">${DATA.subject} ${l.cls}</div><div class="p">第${l.p}节${l.adj?" · 临时安排":""}</div></div>
      ${now>=s&&now<e?"<span class='tag'>进行中</span>":""}</div>`;
  });
  h += "<div class='sect'>今日待办</div><div id='todayTodos'></div></div>";
  document.getElementById("todayHost").innerHTML = h;
  const ts = TODOS.filter(t=>t.date==ds);
  document.getElementById("todayTodos").innerHTML = ts.length ? ts.map(t=>`<div class="todo${t.done?" done":""}">
    <input type="checkbox" aria-label="完成" ${t.done?"checked":""} onchange="toggleTodo(${t.id})">
    <span>${t.text}</span>
    <button class="del" aria-label="删除待办" onclick="delTodo(${t.id})">✕</button></div>`).join("")
    : "<div class='empty'>暂无待办，点右下角 + 添加</div>";
}
function toggleTodo(id){ const t=TODOS.find(x=>x.id==id); t.done=!t.done; saveAll(); setTab(tab); }
function delTodo(id){ if(!confirm("确定删除这条待办吗？")) return; TODOS=TODOS.filter(x=>x.id!=id); saveAll(); setTab(tab); }

/* ================= 添加待办 ================= */
function openTodoSheet(ds){
  const d = ds || dstr(today);
  const m = document.createElement("div");
  m.className = "mask";
  m.innerHTML = `<div class="sheet"><h3>添加待办 · ${d}</h3>
    <input type="date" id="tdDate" value="${d}">
    <textarea id="tdText" placeholder="要做什么？如：批改四.3作业、备课、填表格"></textarea>
    <div class="row"><button class="b-cancel" onclick="this.closest('.mask').remove()">取消</button>
    <button class="b-ok" onclick="addTodo()">保存</button></div></div>`;
  document.body.appendChild(m);
}
function addTodo(){
  const date = document.getElementById("tdDate").value;
  const text = document.getElementById("tdText").value.trim();
  if(!text){ toast("请填写待办内容"); return; }
  TODOS.push({ id:Date.now(), date, text, done:false });
  saveAll(); document.querySelectorAll(".mask").forEach(x=>x.remove());
  toast("已添加待办"); setTab(tab);
}

/* ================= 切换 ================= */
const main = document.getElementById("main");
const today = new Date();
let tab = "today";
main.innerHTML = `<div id="todayHost" style="display:none"></div><div id="cal" style="display:none"></div>`;
function setTab(t){
  ["Today","Week","Month"].forEach(x=>document.getElementById("tab"+x).classList.toggle("on", t.toLowerCase()==x.toLowerCase()));
  if(t=="today"){
    renderToday();
    document.getElementById("todayHost").style.display = "";
    document.getElementById("cal").style.display = "none";
  }else{
    const view = t=="week" ? "timeGridWeek" : "dayGridMonth";
    if(!calendar) makeCalendar();          // 全程只创建一次，日期由 FullCalendar 自己保持
    calendar.changeView(view);
    document.getElementById("todayHost").style.display = "none";
    document.getElementById("cal").style.display = "";
  }
  tab = t;
}
document.getElementById("tabToday").onclick = ()=>setTab("today");
document.getElementById("tabWeek").onclick = ()=>setTab("week");
document.getElementById("tabMonth").onclick = ()=>setTab("month");
document.getElementById("hTitle").textContent = `${DATA.subject} · ${DATA.teacher}`;
setTab("today");
</script>
</body>
</html>
